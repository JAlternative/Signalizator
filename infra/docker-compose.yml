services:
  postgres:
    image: postgres:16
    container_name: agent-platform-postgres
    environment:
      POSTGRES_USER: agent_platform_user
      POSTGRES_PASSWORD: agent_platform_password
      POSTGRES_DB: agent_platform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: